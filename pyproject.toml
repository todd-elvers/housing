[project]
name = "housing-bridges"
version = "0.1.0"
description = "Python bridge scripts for data sources without a usable JS path (HomeHarvest / Realtor.com)"
requires-python = ">=3.10"
dependencies = [
    "homeharvest>=0.4.0",
]

[tool.uv]
# uv manages a local .venv; the TS HomeHarvest adapter shells out via `uv run`.
package = false
