name: ingest

# No `schedule:` on purpose — GitHub delivers scheduled ticks best-effort and
# dropped ~half of ours (observed Jul 2026: 6-7 of 13 fired/day). The hourly
# 8:23am–8:23pm PT timing lives in a Cloudflare Worker cron instead
# (infra/cron-worker), which dispatches this workflow via the API — those are
# delivered immediately and reliably.
on:
  workflow_dispatch:

# One writer at a time — a mid-flight DB sync must never overlap with the next.
concurrency:
  group: ingest
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      # AGE_KEY is the CI identity's private key — the ONLY GitHub secret.
      # Everything else (Turso URL/token, Discord webhooks, API keys) is decrypted
      # from the committed .env.age at startup. Installed FIRST so the
      # report-errors step can still alert Discord if setup itself fails.
      - name: Install age identity
        env:
          AGE_KEY: ${{ secrets.AGE_KEY }}
        run: |
          mkdir -p ~/.age
          printf '%s\n' "$AGE_KEY" > ~/.age/key.txt
          chmod 600 ~/.age/key.txt

      # Installs node/aube/python/uv/age at the versions pinned in mise.toml.
      # The pinned cpython build predates GitHub artifact attestations; skip that
      # check in CI (mise still verifies the checksum).
      - uses: jdx/mise-action@v3
        env:
          MISE_PYTHON_GITHUB_ATTESTATIONS: "false"

      - name: Install JS deps
        run: mise exec -- aube install

      - name: Install Python deps (homeharvest source)
        run: mise exec -- uv sync

      # Free sources only (no --paid: metered APIs stay a deliberate, manual act).
      # craigslist is skipped — it 403s datacenter IPs like GitHub's runners.
      - name: Ingest
        id: ingest
        run: |
          set -o pipefail
          mise exec -- aube exec tsx src/main.ts ingest --json --skip craigslist | tee ingest-result.json

      - name: Report errors to Discord
        if: always()
        env:
          INGEST_OUTCOME: ${{ steps.ingest.outcome }}
        run: mise exec -- aube exec tsx scripts/ci-report.ts ingest-result.json
