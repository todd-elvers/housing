name: ingest

# No `schedule:` on purpose — GitHub delivers scheduled ticks best-effort and
# dropped ~half of ours (observed Jul 2026: 6-7 of 13 fired/day). The timing —
# every 10 minutes, around the clock — lives in a Cloudflare Worker cron
# instead (infra/cron-worker), which dispatches this workflow via the API —
# those are delivered immediately and reliably. The repo is public, so these
# runs cost no Actions minutes.
on:
  workflow_dispatch:

# One writer at a time — a mid-flight DB sync must never overlap with the next.
concurrency:
  group: ingest
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      # AGE_KEY is the CI identity's private key — the ONLY GitHub secret.
      # Everything else (Turso URL/token, Discord webhooks, API keys) is decrypted
      # from the committed .env.age at startup. Installed FIRST so the
      # report-errors step can still alert Discord if setup itself fails.
      - name: Install age identity
        env:
          AGE_KEY: ${{ secrets.AGE_KEY }}
        run: |
          mkdir -p ~/.age
          printf '%s\n' "$AGE_KEY" > ~/.age/key.txt
          chmod 600 ~/.age/key.txt

      # Installs node/aube/python/uv/age at the versions pinned in mise.toml.
      # The pinned cpython build predates GitHub artifact attestations; skip that
      # check in CI (mise still verifies the checksum).
      - uses: jdx/mise-action@v3
        env:
          MISE_PYTHON_GITHUB_ATTESTATIONS: "false"

      - name: Install JS deps
        run: mise exec -- aube install

      - name: Install Python deps (homeharvest source)
        run: mise exec -- uv sync

      # Free sources only (no --paid: metered APIs stay a deliberate, manual act).
      # craigslist is skipped — it 403s datacenter IPs like GitHub's runners.
      #
      # No Discord error reporting after this step any more: nobody watches the
      # Discord surface now that the webapp exists, and at a 10-minute cadence a
      # flaky source would post an alert every run. Source- and DB-level failures
      # (a flaky scrape, Turso's write quota) don't redden the run either — every
      # source still scrapes, the errors come back in the result JSON, and the
      # step below surfaces them as warning annotations. Only a hard crash
      # (nothing scraped at all) fails the workflow.
      - name: Ingest
        id: ingest
        run: |
          set -o pipefail
          mise exec -- aube exec tsx src/main.ts ingest --json --skip craigslist | tee ingest-result.json

      - name: Surface source errors as warnings
        if: always()
        run: |
          [ -s ingest-result.json ] || exit 0
          jq -r '.errors[]? | "::warning title=ingest source failed::\(.source): \(.error | gsub("\\s+"; " "))"' ingest-result.json
