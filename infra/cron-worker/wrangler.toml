# Cloudflare Worker that replaces GitHub's flaky `schedule` trigger: CF cron
# triggers fire on the clock (not best-effort), and each tick just asks GitHub
# to `workflow_dispatch` the ingest workflow, which IS delivered immediately.
#
# Deploy:   cd infra/cron-worker && wrangler deploy
# Secrets:  wrangler secret put GITHUB_TOKEN            (fine-grained PAT: this
#             repo only, Actions: Read and write — see SETUP.md)
#           wrangler secret put DISCORD_ERROR_WEBHOOK   (optional: alert if the
#             dispatch itself fails)
# Logs:     wrangler tail

name = "housing-ingest-cron"
main = "src/index.js"
compatibility_date = "2026-07-01"

[triggers]
# On the hour, 8am–10pm Pacific (PDT = UTC-7): 15:00–23:00 + 00:00–05:00 UTC.
# Cloudflare crons are UTC and fire reliably (no top-of-hour rush to dodge);
# fixed to PDT, so runs shift an hour in local time when PST returns.
crons = ["0 0-5,15-23 * * *"]

[observability]
enabled = true
