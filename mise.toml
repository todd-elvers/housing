# mise-en-place: tool versions + tasks for the housing CLI.
# One-command setup from a clean clone:  mise run bootstrap
# (its first step runs `mise install`, so a fresh clone needs only `mise` on the host.)

[tools]
node = "22"
"github:jdx/aube" = "1.25.1"   # fast Node package manager (jdx) — replaces pnpm; reads/writes pnpm-lock.yaml in place
python = "3.12"
uv = "latest"
age = "1.3.1"   # secrets: decrypt the committed .env.age at startup with your ~/.age/key.txt

[settings]
# Pin exact resolved tool versions in mise.lock so every machine installs identical versions.
lockfile = true

[env]
# node:sqlite is "experimental" in node 22 — silence the per-run warning.
NODE_OPTIONS = "--disable-warning=ExperimentalWarning"

[tasks.bootstrap]
description = "Install tool versions + JS/Python deps (one-shot setup from a clean clone)"
run = [
  "mise install",
  # Only scaffold a plaintext .env when there are no committed encrypted secrets;
  # if .env.age exists it's decrypted in memory at startup (needs your age key).
  "test -f .env || test -f .env.age || cp .env.example .env",
  "mise exec -- aube install",
  "mise exec -- uv sync",
]

[tasks.housing]
description = "Run the housing CLI. Forward args after `--`:  mise run housing -- ingest --source craigslist"
run = "aube exec tsx src/main.ts"

[tasks.test]
description = "Self-discovering integration test: exercises every command + source (HOUSING_TEST_LIVE=0 to skip network)"
run = "aube exec tsx --test test/tools.test.ts"

[tasks.format]
description = "Format src/ + test/ with oxfmt"
run = "aube exec oxfmt src test"

[tasks.lint]
description = "Lint src/ with oxlint"
run = "aube exec oxlint src"

[tasks.typecheck]
description = "Type-check the whole graph with tsgo (fast native TS compiler)"
run = "aube exec tsgo --noEmit"

[tasks.check]
description = "Format, then lint + typecheck"
run = ["mise run format", "mise run lint", "mise run typecheck"]

[tasks.db]
description = "Open the SQLite DB in the sqlite3 shell"
run = "sqlite3 data/housing.db"

[tasks."secrets:keygen"]
description = "Generate your age identity (~/.age/key.txt) and print your public key for .age.public-keys"
run = "scripts/keygen.sh"

[tasks."secrets:set"]
description = "Add/update ONE secret in .env.age, fully in memory (no plaintext on disk). Usage: mise run secrets:set -- KEY"
run = "scripts/set-secret.sh"

[tasks."secrets:unset"]
description = "Remove ONE secret from .env.age, fully in memory (no plaintext on disk). Usage: mise run secrets:unset -- KEY"
run = "scripts/unset-secret.sh"

[tasks."secrets:decrypt"]
description = "Print decrypted secrets to STDOUT (never writes a file). Pipe it, e.g. `mise run secrets:decrypt | grep KEY`"
run = 'age --decrypt -i "$HOME/.age/key.txt" .env.age'

[tasks."secrets:encrypt"]
description = "Bulk: encrypt an existing plaintext .env → .env.age (delete .env after; prefer secrets:set to avoid plaintext on disk)"
run = 'age --encrypt -R .age.public-keys -o .env.age .env && echo "Encrypted .env → .env.age (commit it; then: rm .env)"'
